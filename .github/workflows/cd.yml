name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: >
      ${{ github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_branch == 'main'
          && github.event.workflow_run.head_repository.full_name == github.repository }}

    concurrency:
      group: production-deploy
      cancel-in-progress: false

    runs-on: ubuntu-latest

    steps:
      - name: Checkout CI passed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/likelion-demoday-coze/backend:${{ github.event.workflow_run.head_sha }}
            ghcr.io/likelion-demoday-coze/backend:latest

      - name: Copy deployment scripts
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: scripts/ops
          target: /home/ubuntu/Backend/releases/${{ github.event.workflow_run.head_sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 90m
          script: |
            set -eu
            echo "${{ secrets.GHCR_PAT }}" | sudo docker login ghcr.io \
              -u "${{ secrets.GHCR_USERNAME }}" \
              --password-stdin

            sudo bash /home/ubuntu/Backend/releases/${{ github.event.workflow_run.head_sha }}/scripts/ops/deploy.sh \
              '${{ github.event.workflow_run.head_sha }}'

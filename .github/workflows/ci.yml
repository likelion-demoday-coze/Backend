name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'docs/**'
      - 'refactor/**'
      - 'chore/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Check deployment scripts and recovery paths
        run: |
          for script in scripts/ops/*.sh scripts/ops/tests/*.sh; do bash -n "$script"; done
          bash scripts/ops/tests/deploy-test.sh
          bash scripts/ops/tests/check-disk-test.sh
          python3 scripts/ops/tests/smoke-test.py

      - name: Run tests
        run: ./gradlew test

      - name: Build
        run: ./gradlew build -x test

      - name: Build Docker image
        run: docker build -t backend:ci .

services:
  lgtm:
    image: grafana/otel-lgtm:latest
    container_name: backend-lgtm
    ports:
      - "3001:3000"
      - "4317:4317"
      - "4318:4318"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    restart: unless-stopped

  backend:
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-demoday-backend}
      OTEL_ENVIRONMENT: ${OTEL_ENVIRONMENT:-local}
      OTEL_TRACING_SAMPLING_PROBABILITY: ${OTEL_TRACING_SAMPLING_PROBABILITY:-1.0}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://lgtm:4318/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://lgtm:4318/v1/logs
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://lgtm:4318/v1/metrics
    depends_on:
      lgtm:
        condition: service_started


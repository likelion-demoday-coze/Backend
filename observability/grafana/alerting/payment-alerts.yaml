apiVersion: 1

groups:
  - orgId: 1
    name: payment-alerts
    folder: COZ:E
    interval: 1m

    rules:
      - uid: payment-feedback-failure
        title: 결제 Feedback 실패 발생
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error

        annotations:
          summary: 페이앱 Feedback 처리 실패가 발생했습니다.
          description: 최근 5분 동안 결제 Feedback 처리 실패가 발생했습니다.

        labels:
          severity: critical
          domain: payment

        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: sum(increase(payment_feedback_total{result="failure"}[5m]))
              instant: true
              refId: A

          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              type: reduce
              reducer: last
              refId: B

          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last

      - uid: payment-fulfillment-failure
        title: 결제 상품 지급 실패 발생
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error

        annotations:
          summary: 승인된 결제의 패스 지급이 실패했습니다.
          description: 지급 재처리 대상 결제가 발생했는지 확인해 주세요.

        labels:
          severity: critical
          domain: payment

        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: sum(increase(payment_fulfillment_total{result="failure"}[5m]))
              instant: true
              refId: A

          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              type: reduce
              reducer: last
              refId: B

          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last

      - uid: payment-cancellation-failure
        title: 결제 취소 실패 발생
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error

        annotations:
          summary: 결제 취소 요청 처리에 실패했습니다.
          description: CANCEL_REQUESTED 상태와 페이앱 실제 취소 상태를 확인해 주세요.

        labels:
          severity: warning
          domain: payment

        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              expr: sum(increase(payment_cancellation_total{result="failure"}[5m]))
              instant: true
              refId: A

          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              type: reduce
              reducer: last
              refId: B

          - refId: C
            datasourceUid: __expr__
            model:
              expression: B
              type: threshold
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    type: last
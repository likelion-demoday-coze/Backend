spring:
  application:
    name: backend
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_REST_API_KEY}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: ${KAKAO_REDIRECT_URI}
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  stock:
    snapshot-start-date: ${STOCK_SNAPSHOT_START_DATE:${RANKING_SETTLEMENT_START_DATE:2026-10-31}}
  frontend-base-url: ${FRONTEND_BASE_URL}
  frontend-login-success-path: ${FRONTEND_LOGIN_SUCCESS_PATH:/home}
  frontend-allowed-origins: ${FRONTEND_ALLOWED_ORIGINS:${FRONTEND_BASE_URL}}
  ranking:
    settlement-start-date: ${RANKING_SETTLEMENT_START_DATE:2026-10-31}

  payment:
    frontend-success-path: ${PAYMENT_FRONTEND_SUCCESS_PATH:/payment/success}
    frontend-failure-path: ${PAYMENT_FRONTEND_FAILURE_PATH:/payment/failure}
    fulfillment-retry-cron: ${PAYMENT_FULFILLMENT_RETRY_CRON:0 */5 * * * *}
    korpay:
      merchant-id: ${KORPAY_MERCHANT_ID}
      merchant-key: ${KORPAY_MKEY}
      base-url: ${KORPAY_BASE_URL:https://payments.korpay.com/v1}
      return-url: ${KORPAY_RETURN_URL:${BACKEND_BASE_URL}/api/v1/payments/callback}
      pay-method: ${KORPAY_PAY_METHOD:card}
      connect-timeout: ${KORPAY_CONNECT_TIMEOUT:1s}
      read-timeout: ${KORPAY_READ_TIMEOUT:3s}

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: ${SESSION_COOKIE_SAME_SITE:none}
        secure: ${SESSION_COOKIE_SECURE:true}

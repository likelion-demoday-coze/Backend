spring:
  application:
    name: backend
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_REST_API_KEY}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: ${KAKAO_REDIRECT_URI}
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9090}
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}

  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

  opentelemetry:
    enabled: ${OTEL_ENABLED:false}

    resource-attributes:
      service.name: ${OTEL_SERVICE_NAME:${spring.application.name}}
      deployment.environment.name: ${OTEL_ENVIRONMENT:local}

    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
          connect-timeout: 1s
          timeout: 3s

    logging:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:http://localhost:4318/v1/logs}
          connect-timeout: 1s
          timeout: 3s

  tracing:
    sampling:
      probability: ${OTEL_TRACING_SAMPLING_PROBABILITY:0.1}

    export:
      otlp:
        enabled: ${OTEL_ENABLED:false}

  logging:
    export:
      otlp:
        enabled: ${OTEL_ENABLED:false}

  otlp:
    metrics:
      export:
        enabled: ${OTEL_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        step: ${OTEL_METRIC_EXPORT_INTERVAL:10s}
        base-time-unit: seconds
        connect-timeout: 1s
        read-timeout: 3s

  metrics:
    tags:
      application: ${spring.application.name:demoday-backend}

    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true

  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    demoday.backend.payment: INFO

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [traceId:%X{traceId:-}] [spanId:%X{spanId:-}] [requestId:%X{requestId:-}] [jobName:%X{jobName:-}] [jobRunId:%X{jobRunId:-}] %logger{36} - %msg%n"

springdoc:
  swagger-ui:
    path: /swagger-ui.html

liner:
  api-key: ${LINER_API_KEY:}
  timeout-seconds: ${LINER_TIMEOUT_SECONDS:120}

app:
  service:
    sales-end-at: ${SALES_END_AT:2026-11-15T00:00:00+09:00}
    service-end-at: ${SERVICE_END_AT:2026-11-21T23:59:59+09:00}

  pass:
    duration: ${PASS_DURATION:168h}

  economic-trends:
    enabled: ${ECONOMIC_TRENDS_ENABLED:false}
    local-generate-on-startup: ${ECONOMIC_TRENDS_LOCAL_GENERATE_ON_STARTUP:false}

  stock:
    snapshot-start-date: ${STOCK_SNAPSHOT_START_DATE:${RANKING_SETTLEMENT_START_DATE:2026-10-31}}

  frontend-base-url: ${FRONTEND_BASE_URL}
  frontend-login-success-path: ${FRONTEND_LOGIN_SUCCESS_PATH:/home}
  frontend-allowed-origins: ${FRONTEND_ALLOWED_ORIGINS:${FRONTEND_BASE_URL}}

  ranking:
    settlement-start-date: ${RANKING_SETTLEMENT_START_DATE:2026-10-31}

  payment:
    fulfillment-retry-delay-ms: ${PAYMENT_FULFILLMENT_RETRY_DELAY_MS:300000}

    logging:
      fulfillment-failure-throttle: ${PAYMENT_FULFILLMENT_FAILURE_LOG_THROTTLE:30m}

    order:
      expiration: ${PAYMENT_ORDER_EXPIRATION:30m}
      expiration-scan-delay-ms: ${PAYMENT_ORDER_EXPIRATION_SCAN_DELAY_MS:60000}

    payapp:
      user-id: ${PAYAPP_USER_ID}
      link-key: ${PAYAPP_LINK_KEY}
      link-value: ${PAYAPP_LINK_VALUE}
      base-url: ${PAYAPP_BASE_URL:https://api.payapp.kr}
      request-path: ${PAYAPP_REQUEST_PATH:/oapi/apiLoad.html}
      feedback-url: ${PAYAPP_FEEDBACK_URL:${BACKEND_BASE_URL}/api/v1/payments/feedback}
      return-url: ${PAYAPP_RETURN_URL:${FRONTEND_BASE_URL}/payment/result}
      open-pay-type: ${PAYAPP_OPEN_PAY_TYPE:card}
      connect-timeout: ${PAYAPP_CONNECT_TIMEOUT:1s}
      read-timeout: ${PAYAPP_READ_TIMEOUT:3s}

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: ${SESSION_COOKIE_SAME_SITE:none}
        secure: ${SESSION_COOKIE_SECURE:true}

spring:
  sql:
    init:
      mode: always
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: test-client-id
            client-secret: test-client-secret
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8080/api/v1/auth/kakao/callback
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  scheduling:
    lock-at-least-for: 0s
  service:
    sales-end-at: 2026-11-22T00:00:00+09:00
    service-end-at: 2026-11-28T23:59:59+09:00
  pass:
    duration: 168h
  frontend-base-url: http://localhost:3000
  ranking:
    settlement-start-date: 2026-10-31

  payment:
    enabled: true
    order:
      expiration: 30m
      expiration-scan-delay-ms: 60000
    payapp:
      user-id: test-user
      link-key: test-link-key
      link-value: test-link-value
      base-url: http://localhost:9999
      request-path: /oapi/apiLoad.html
      feedback-url: http://localhost:8080/api/v1/payments/feedback
      return-url: http://localhost:3000/payment/result
      open-pay-type: card
      connect-timeout: 1s
      read-timeout: 3s
    logging:
      fulfillment-failure-throttle: 30m

management:
  opentelemetry:
    enabled: false

  tracing:
    export:
      otlp:
        enabled: false

  logging:
    export:
      otlp:
        enabled: false

  otlp:
    metrics:
      export:
        enabled: false
